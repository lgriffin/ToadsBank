name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates in the spec's order: lint, architecture, unit and BDD, contract, integration, traceability, images.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:arch
      - run: npm test
      - run: npm run trace
      - run: npm audit --audit-level=high --omit=dev

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: luarocks install luacheck
      - name: luacheck (no WoW global in the core, TB-DM-02)
        working-directory: addon
        run: luacheck .
      - name: busted (core, adapters on a fake client, contract fixtures TB-DM-03)
        working-directory: addon
        run: busted
      - name: The dependency-free runner agrees (spec/run.lua)
        working-directory: addon
        run: lua spec/run.lua
      - name: Pack
        run: sh addon/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: toadsbank-addon
          path: addon/dist/*.zip
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: toadsbank
          POSTGRES_DB: toadsbank
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI container reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toadsbank" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TOADSBANK_TEST_DATABASE_URL: postgresql://toadsbank@localhost:5432/toadsbank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  mutation:
    # Stryker over the domain package. The floor starts at the current score and only goes up (spec §9 proposes
    # 85% domain and 75% application once the suite matures; see the decisions issue).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker build --target api -t toadsbank/toadsbank-api:dev -f docker/Dockerfile .
          docker build --target worker -t toadsbank/toadsbank-worker:dev -f docker/Dockerfile .
      - name: Compose smoke test (TB-DM-05)
        run: |
          sh docker/init-secrets.sh
          docker compose -f docker/compose.yaml up -d --wait --wait-timeout 120 api worker
          curl -fsS http://localhost:8090/health
          docker compose -f docker/compose.yaml run --rm migrate seed
          token="$(cat docker/secrets/service_token.txt)"
          curl -fsS -H "authorization: Bearer $token" -H "x-toads-member: 1" http://localhost:8090/v1/inventory | grep -q 'Super Mana Potion'
      - name: Compose logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs
